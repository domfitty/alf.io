services:
    db:
        image: postgres:10
        env_file:
            - .env
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
            interval: 10s
            retries: 5
            start_period: 30s
            timeout: 10s
        # 5432 non pubblicata (09/10/2026): il DB serve solo ad Alf.io, sulla rete dello stack.
        volumes:
            - /home/domfitty/alfio/postgres-data:/var/lib/postgresql/data
        networks:
            - alfio_default

    alfio:
        # versione fissata (09/10/2026): stessa immagine in esercizio, digest sha256:cc921decdca2…
        image: alfio/alf.io:2.0-M5-2609
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "7080:8080"
        networks:
            - alfio_default

    cloudflared:
        image: wisdomsky/cloudflared-web:latest
        restart: unless-stopped
        # pannello web 14333 non pubblicato (09/10/2026): era aperto a tutta la LAN senza login.
        volumes:
            - /home/domfitty/cloudflared_root:/root/.cloudflared
            - /home/domfitty/cloudflared_config:/config
        networks:
            - alfio_default

networks:
    alfio_default:
        external: false
