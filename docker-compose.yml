services:
    db:
        image: postgres:10
        env_file:
            - .env
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
            interval: 10s
            retries: 5
            start_period: 30s
            timeout: 10s
        # 5432 non pubblicata (09/10/2026): il DB serve solo ad Alf.io, sulla rete dello stack.
        volumes:
            - /home/domfitty/alfio/postgres-data:/var/lib/postgresql/data
        networks:
            - alfio_default

    alfio:
        # versione fissata (09/10/2026): stessa immagine in esercizio, digest sha256:cc921decdca2…
        image: alfio/alf.io:2.0-M5-2609
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "7080:8080"   # da qui passa il tunnel ProxmoxCasa (LXC 104) dal 09/10/2026
        networks:
            - alfio_default

networks:
    alfio_default:
        external: false
